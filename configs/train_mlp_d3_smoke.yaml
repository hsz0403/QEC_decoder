data:
  train: runs/data/stim_d3_smoke_train.npz
  val: runs/data/stim_d3_smoke_val.npz
model:
  name: mlp
  hidden_dim: 128
  dropout: 0.1
training:
  batch_size: 256
  epochs: 10
  lr: 0.0003
  weight_decay: 0.00001
  grad_clip_norm: 1.0
  pos_weight: auto
  seed: 0
  num_threads: 1
output:
  run_dir: runs/mlp_d3_smoke
